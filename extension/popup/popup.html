<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>WebJump</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎲</span>
      <div class="brand-text">
        <strong>WebJump</strong>
        <span id="siteCount" class="muted">…个有趣网站</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="addCurrent" class="icon-btn" title="添加当前网页">＋</button>
      <button id="openManage" class="icon-btn" title="打开管理页">⚙</button>
    </div>
  </header>

  <section class="hero">
    <button id="surpriseBtn" class="surprise-btn">
      <span class="dice">🎲</span>
      <span class="txt">Surprise !</span>
    </button>
    <p id="tip" class="tip" hidden></p>
    <div class="scope-row">
      <label for="scopeSel">抽取范围</label>
      <select id="scopeSel"></select>
    </div>
  </section>

  <section class="search">
    <input id="searchInput" type="text" placeholder="搜索网站名称 / 简介 / 链接…" autocomplete="off" />
    <div id="searchResults" class="results" hidden></div>
  </section>

  <section class="recent">
    <h3>最近访问</h3>
    <ul id="recentList"></ul>
  </section>

  <div id="confirmMask" class="mask" hidden>
    <div class="confirm-box" role="dialog" aria-modal="true">
      <p id="confirmText" class="confirm-text"></p>
      <p class="confirm-sub">「是」会把该网站从网站库中删除；「否」只删除这条访问记录。</p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="c-btn">取消</button>
        <button id="confirmRecordOnly" class="c-btn">否，仅删记录</button>
        <button id="confirmDeleteSite" class="c-btn danger">是，删除网站</button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
